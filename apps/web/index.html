<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1017" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Wordmark face, same as the landing site; `text=` subsets it to the seven letters of "Newsbid". -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&text=Newsbid&display=swap" />
    <!-- Preview tags; the router worker (worker/og.ts) rewrites these per link with absolute URLs. -->
    <title>Newsbid</title>
    <meta name="description" content="Themed bags of tokenized stocks and pre-IPO tokens, with the stories behind them." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Newsbid" />
    <meta property="og:title" content="Newsbid — Swipe the news. Buy the bag." />
    <meta property="og:description" content="Themed bags of tokenized stocks and pre-IPO tokens, with the stories behind them." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
